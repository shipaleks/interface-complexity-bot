[metadata]
name = interface-complexity-bot
version = 0.1.0
description = Telegram bot for analyzing UI complexity
author = Interface Analyzer Team
license = MIT

[options]
packages = find:
python_requires = >=3.8
install_requires =
    python-telegram-bot>=20.0
    python-dotenv>=1.0.0
    Pillow>=9.0.0
    matplotlib>=3.5.0
    numpy>=1.20.0
    openai>=1.0.0
    google-generativeai>=0.3.0
    requests>=2.27.0
    seaborn>=0.11.0
    tqdm>=4.62.0
    reportlab>=3.6.0
    PyPDF2>=2.0.0

[options.entry_points]
console_scripts =
    ui-analyzer-bot = run:main 